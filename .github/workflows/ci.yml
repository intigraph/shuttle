name: ci

# The release lane builds from a tag and publishes an artifact the fleet
# installs unattended. That is only safe if main is already known-good, so
# the same suite runs on every push and pull request.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is pyproject's requires-python; the ceiling is what the
        # fleet actually runs. Both are tested because a release is installed
        # on whichever it finds.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Compile every source file
        run: python -m py_compile shuttle/*.py tests/*.py
      - name: Unit suite
        run: python -m unittest discover -s tests -v
      - name: Verify release auth and publication boundaries
        run: |
          python -m pip install 'PyYAML==6.0.2'
          python scripts/test_release_workflow.py
      - name: The version has a changelog section
        # The release lane publishes this section as the release notes, so a
        # bump without one would ship notes that do not describe it.
        run: python scripts/check-changelog.py
      - name: The version command answers (the deploy interface)
        run: |
          set -euo pipefail
          line="$(shuttle version)"
          echo "$line"
          # Field 2 is what the deploy actuator parses. Assert the shape here
          # so a change to it fails in CI rather than in an unattended deploy.
          test "$(printf '%s' "$line" | awk '{print $1}')" = "shuttle"
          test -n "$(printf '%s' "$line" | awk '{print $2}')"

  repository-pendant-source:
    name: Repository pendant source controls
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install 'rdflib==7.1.4'
      - run: |
          python scripts/test-repository-knowledge.py
          python scripts/test-repository-share-publication.py
          python scripts/test-repository-share-query.py
