<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-label="How a run becomes a record you can check. On the left, three things can take a step: a person or an agent with shuttle advance, a Seeds work item through shuttle reconcile, and a Chaski schedule through shuttle scheduled. Each step enters Shuttle on the machine where it happens. Shuttle checks that the step is legal from the run&#x27;s state and otherwise refuses it, signs it with the key of whoever took it, and appends it to a local log. shuttle export sends the log to Quipu, which holds this month&#x27;s graph of runs and signed transitions, the frozen months that stay queryable, and the public keys a person registered. shuttle verify reads the run back from Quipu and checks every signature. Shantytown, a dashboard or your own query reads runs from Quipu and never calls Shuttle.">
  <style>
    .t{font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif}
    .m{font-family:JetBrains Mono,Menlo,Consolas,monospace}
    .card{fill:#20203a;stroke:#2e2e4d}
    .pipe{stroke:#ff8a70;stroke-width:2.5;fill:none;stroke-dasharray:6 6;opacity:.75;animation:flow 1.2s linear infinite}
    .up{stroke:#ffc24d;stroke-width:2;fill:none;stroke-dasharray:4 5;opacity:.8;animation:flow 1.6s linear infinite}
    .down{stroke:#ff4fa0;stroke-width:2;fill:none;stroke-dasharray:4 5;opacity:.8;animation:flow 1.6s linear infinite reverse}
    @keyframes flow{to{stroke-dashoffset:-24}}
    @media (prefers-reduced-motion: reduce){.pipe,.up,.down{animation:none}}
  </style>
  <rect width="960" height="560" rx="20" fill="#12121f"/>
  <text class="t" x="40" y="52" fill="#ecebf5" font-size="24" font-weight="700">How a run becomes a record you can check</text>
  <text class="t" x="40" y="78" fill="#a7a6c2" font-size="14">A step is checked and signed on the machine where it happens. The record lives in Quipu, where anyone can check it.</text>
  <text class="t" x="30" y="122" fill="#ffc24d" font-size="10" font-weight="700" letter-spacing="1">WHO TAKES A STEP</text>
  <text class="t" x="290" y="122" fill="#ffc24d" font-size="10" font-weight="700" letter-spacing="1">SHUTTLE, ON THIS MACHINE</text>
  <text class="t" x="650" y="122" fill="#ffc24d" font-size="10" font-weight="700" letter-spacing="1">QUIPU</text>
  <rect x="30" y="136" width="220" height="110" rx="14" fill="#20203a" stroke="#2e2e4d" stroke-width="1.2"/>
  <text class="t" x="46" y="164" fill="#ecebf5" font-size="15" font-weight="700">A person or an agent</text>
  <text class="m" x="46" y="186" fill="#ff4fa0" font-size="12">shuttle advance</text>
  <text class="t" x="46" y="210.0" fill="#a7a6c2" font-size="12.5">Names the step it took.</text>
  <path class="pipe" d="M252 191 H280"/>
  <polygon points="288,191 279,186 279,196" fill="#ff8a70"/>
  <rect x="30" y="264" width="220" height="110" rx="14" fill="#20203a" stroke="#2e2e4d" stroke-width="1.2"/>
  <text class="t" x="46" y="292" fill="#ecebf5" font-size="15" font-weight="700">A Seeds work item</text>
  <text class="m" x="46" y="314" fill="#ff4fa0" font-size="12">shuttle reconcile</text>
  <text class="t" x="46" y="338.0" fill="#a7a6c2" font-size="12.5">The step advances when the</text>
  <text class="t" x="46" y="355.2" fill="#a7a6c2" font-size="12.5">item closes.</text>
  <path class="pipe" d="M252 319 H280"/>
  <polygon points="288,319 279,314 279,324" fill="#ff8a70"/>
  <rect x="30" y="392" width="220" height="110" rx="14" fill="#20203a" stroke="#2e2e4d" stroke-width="1.2"/>
  <text class="t" x="46" y="420" fill="#ecebf5" font-size="15" font-weight="700">A Chaski schedule</text>
  <text class="m" x="46" y="442" fill="#ff4fa0" font-size="12">shuttle scheduled</text>
  <text class="t" x="46" y="466.0" fill="#a7a6c2" font-size="12.5">Each occurrence is one signed</text>
  <text class="t" x="46" y="483.2" fill="#a7a6c2" font-size="12.5">run.</text>
  <path class="pipe" d="M252 447 H280"/>
  <polygon points="288,447 279,442 279,452" fill="#ff8a70"/>
  <rect x="290" y="136" width="260" height="366" rx="14" fill="#20203a" stroke="#ff4fa0" stroke-width="1.6"/>
  <rect x="306" y="152" width="228" height="102" rx="10" fill="#12121f" stroke="#2e2e4d" stroke-width="1.2"/>
  <text class="m" x="322" y="180" fill="#ffc24d" font-size="13" font-weight="700">1</text>
  <text class="t" x="342" y="180" fill="#ecebf5" font-size="16" font-weight="700">Check</text>
  <text class="t" x="322" y="202.0" fill="#a7a6c2" font-size="12.5">Is the step legal from the</text>
  <text class="t" x="322" y="219.2" fill="#a7a6c2" font-size="12.5">run&#x27;s state? If not, refuse it</text>
  <text class="t" x="322" y="236.4" fill="#a7a6c2" font-size="12.5">and name the steps that are.</text>
  <path class="pipe" d="M420 256 V260"/>
  <polygon points="420,267 415,258 425,258" fill="#ff8a70"/>
  <rect x="306" y="268" width="228" height="102" rx="10" fill="#12121f" stroke="#2e2e4d" stroke-width="1.2"/>
  <text class="m" x="322" y="296" fill="#ffc24d" font-size="13" font-weight="700">2</text>
  <text class="t" x="342" y="296" fill="#ecebf5" font-size="16" font-weight="700">Sign</text>
  <text class="t" x="322" y="318.0" fill="#a7a6c2" font-size="12.5">With the ed25519 key of</text>
  <text class="t" x="322" y="335.2" fill="#a7a6c2" font-size="12.5">whoever took the step.</text>
  <path class="pipe" d="M420 372 V376"/>
  <polygon points="420,383 415,374 425,374" fill="#ff8a70"/>
  <rect x="306" y="384" width="228" height="102" rx="10" fill="#12121f" stroke="#2e2e4d" stroke-width="1.2"/>
  <text class="m" x="322" y="412" fill="#ffc24d" font-size="13" font-weight="700">3</text>
  <text class="t" x="342" y="412" fill="#ecebf5" font-size="16" font-weight="700">Append</text>
  <text class="t" x="322" y="434.0" fill="#a7a6c2" font-size="12.5">One line in an append-only</text>
  <text class="t" x="322" y="451.2" fill="#a7a6c2" font-size="12.5">log. A run&#x27;s state is that</text>
  <text class="t" x="322" y="468.4" fill="#a7a6c2" font-size="12.5">log, replayed.</text>
  <rect x="650" y="136" width="280" height="250" rx="14" fill="#20203a" stroke="#2e2e4d" stroke-width="1.2"/>
  <rect x="666" y="152" width="248" height="62" rx="10" fill="#12121f" stroke="#2e2e4d" stroke-width="1.2"/>
  <text class="t" x="682" y="177" fill="#ecebf5" font-size="14" font-weight="700">This month&#x27;s graph</text>
  <text class="t" x="682" y="198" fill="#a7a6c2" font-size="12.5">Runs and signed transitions.</text>
  <rect x="666" y="228" width="248" height="62" rx="10" fill="#12121f" stroke="#2e2e4d" stroke-width="1.2"/>
  <text class="t" x="682" y="253" fill="#ecebf5" font-size="14" font-weight="700">Frozen months</text>
  <text class="t" x="682" y="274" fill="#a7a6c2" font-size="12.5">Read-only, and still queryable.</text>
  <rect x="666" y="304" width="248" height="62" rx="10" fill="#12121f" stroke="#2e2e4d" stroke-width="1.2"/>
  <text class="t" x="682" y="329" fill="#ecebf5" font-size="14" font-weight="700">Public keys</text>
  <text class="t" x="682" y="350" fill="#a7a6c2" font-size="12.5">A person registers them.</text>
  <path class="pipe" d="M552 200 H640"/>
  <polygon points="648,200 639,195 639,205" fill="#ff8a70"/>
  <text class="m" x="600" y="190" fill="#ff8a70" font-size="12" text-anchor="middle">export</text>
  <path class="down" d="M648 330 H562"/>
  <polygon points="552,330 561,325 561,335" fill="#ff4fa0"/>
  <text class="m" x="600" y="320" fill="#ff4fa0" font-size="12" text-anchor="middle">verify</text>
  <path class="down" d="M790 388 V402"/>
  <polygon points="790,410 785,401 795,401" fill="#ff4fa0"/>
  <rect x="650" y="412" width="280" height="90" rx="14" fill="#20203a" stroke="#2e2e4d" stroke-width="1.2"/>
  <text class="t" x="666" y="436" fill="#ffc24d" font-size="10" font-weight="700" letter-spacing="1">WHO READS THE RECORD</text>
  <text class="t" x="666" y="458.0" fill="#a7a6c2" font-size="12.5">Shantytown, a dashboard or your own</text>
  <text class="t" x="666" y="475.2" fill="#a7a6c2" font-size="12.5">query. They read runs from Quipu and</text>
  <text class="t" x="666" y="492.4" fill="#a7a6c2" font-size="12.5">never call Shuttle.</text>
  <text class="t" x="40" y="536" fill="#6f6e8f" font-size="12.5">Nothing runs in the background: a person, an agent or a timer makes each call.</text>
</svg>
